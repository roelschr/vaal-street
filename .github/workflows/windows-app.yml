# Builds the Windows app: the Python side frozen with PyInstaller, checked, then packed with the
# Electron shell into one installer. PyInstaller cannot build a Windows program from Linux, so this
# runs on a Windows machine.
name: Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-app.yml"
      - "vaalstreet/desktop.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer's file name carries the version from desktop/package.json, and a published
      # release cannot be corrected, so a tag that disagrees with the files stops here.
      - name: Check that the tag matches the version in the files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          app=$(python -c "import json; print(json.load(open('desktop/package.json'))['version'])")
          package=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag $TAG, desktop/package.json $app, pyproject.toml $package"
          test "$TAG" = "v$app" && test "$TAG" = "v$package"

      # 3.12: the text-recognition library has no build for 3.13 or later.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Everything that goes into the installer comes from uv.lock, at the exact versions and file
      # hashes recorded there, so two builds of one commit carry the same libraries. pip refuses any
      # file whose hash is not in the list. The package itself is then added without its dependencies.
      - name: Install the libraries pinned in uv.lock, then the package
        shell: bash
        run: |
          python -m pip install uv==0.8.13
          uv export --frozen --extra screen --extra dev --group build --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          python -m pip install --no-deps .

      # --collect-data vaalstreet brings the page; rapidocr keeps its models and settings as data
      # files, and pynput picks its Windows parts by name at run time, so both are named here.
      - name: Freeze the Python side
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --name vaal-desk --console
          --collect-data vaalstreet
          --collect-all rapidocr_onnxruntime
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --distpath backend --workpath build/pyinstaller --specpath build/pyinstaller
          vaal_desk.py

      - name: Check that it starts, serves the page, starts the screen check and stops
        run: python desktop/smoke.py desktop/backend/vaal-desk/vaal-desk.exe --screen

      - name: Pack the installer
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win --publish never

      - name: Check that the packed app brings the desk up, and stops it when closed
        run: python desktop/smoke_app.py "desktop/dist/win-unpacked/Vaal Street.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VaalStreet-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VaalStreet-Windows
      - name: Attach the installer to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # No fallback that uploads into an existing release: a published release must never have its
        # installer swapped, so a second run for the same tag fails here and says why.
        run: gh release create "$TAG" *.exe --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
