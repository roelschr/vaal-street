[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaalstreet"
version = "2.1.0"
description = "Pricing models, flips, arbitrage, league-start analytics and backtests for the Path of Exile Currency Exchange"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pyarrow>=15", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest"]
# The screen check companion, run under Windows Python next to the game. rapidocr-onnxruntime ships its
# models in the wheel (no download on first run) but has no build for Python 3.13 or later.
screen = ["mss>=9", "pynput>=1.7.6", "rapidocr-onnxruntime>=1.3.24; python_version < '3.13'"]

# Not installed with the package: what the Windows installer's build needs (.github/workflows/windows-app.yml).
# It lives here so that uv.lock pins it, and every build of one commit puts the same libraries in the installer.
[dependency-groups]
build = ["pyinstaller>=6"]

[project.scripts]
vaal = "vaalstreet.cli:main"

[tool.setuptools]
packages = ["vaalstreet"]

[tool.setuptools.package-data]
vaalstreet = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
