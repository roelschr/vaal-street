[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaalstreet"
version = "0.1.0"
description = "Research layer for Path of Exile currency-exchange history"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vaal = "vaalstreet.cli:main"

[tool.setuptools]
packages = ["vaalstreet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
